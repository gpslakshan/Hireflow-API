basePath: /api/v1
definitions:
  dto.ApplicationResponse:
    properties:
      candidate:
        $ref: '#/definitions/dto.UserResponse'
      cover_letter:
        example: I am very excited to apply.
        type: string
      created_at:
        example: "2026-05-01T12:00:00Z"
        type: string
      cv_download_url:
        example: https://s3.amazonaws.com/...
        type: string
      id:
        example: c3d4e5f6-...
        type: string
      job:
        $ref: '#/definitions/dto.JobResponse'
      status:
        example: applied
        type: string
      updated_at:
        example: "2026-05-01T13:00:00Z"
        type: string
    type: object
  dto.ApplyJobRequest:
    properties:
      cover_letter:
        example: I am very excited to apply.
        maxLength: 2000
        type: string
      cv_key:
        example: cvs/da9d5716-4979-4f93-980a-9dfcf00cd02a/my-cv.pdf
        type: string
    type: object
  dto.AssignCompanyRequest:
    properties:
      company_id:
        example: a1b2c3d4-...
        type: string
    required:
    - company_id
    type: object
  dto.AuthResponse:
    properties:
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/dto.UserResponse'
    type: object
  dto.CVUploadURLRequest:
    properties:
      file_name:
        example: my-cv.pdf
        type: string
    required:
    - file_name
    type: object
  dto.CVUploadURLResponse:
    properties:
      cv_key:
        example: cvs/da9d5716-4979-4f93-980a-9dfcf00cd02a/my-cv.pdf
        type: string
      upload_url:
        example: https://hireflow-cvs.s3.amazonaws.com/cvs/...?X-Amz-Signature=...
        type: string
    type: object
  dto.CompanyResponse:
    properties:
      created_at:
        example: "2026-05-01T12:00:00Z"
        type: string
      description:
        example: A leading software company.
        type: string
      id:
        example: a1b2c3d4-...
        type: string
      industry:
        example: Technology
        type: string
      location:
        example: Colombo, Sri Lanka
        type: string
      name:
        example: TechCorp Lanka
        type: string
      website:
        example: https://techcorplanka.com
        type: string
    type: object
  dto.CreateCompanyRequest:
    properties:
      description:
        example: A leading software company.
        type: string
      industry:
        example: Technology
        maxLength: 100
        type: string
      location:
        example: Colombo, Sri Lanka
        maxLength: 150
        type: string
      name:
        example: TechCorp Lanka
        maxLength: 150
        minLength: 2
        type: string
      website:
        example: https://techcorplanka.com
        type: string
    required:
    - description
    - industry
    - location
    - name
    type: object
  dto.CreateJobRequest:
    properties:
      description:
        example: We are looking for an experienced Go engineer.
        type: string
      job_type:
        enum:
        - full_time
        - part_time
        - contract
        - internship
        example: full_time
        type: string
      location:
        example: Colombo, Sri Lanka
        maxLength: 150
        type: string
      title:
        example: Senior Go Engineer
        maxLength: 150
        minLength: 2
        type: string
    required:
    - description
    - job_type
    - location
    - title
    type: object
  dto.JobResponse:
    properties:
      company:
        $ref: '#/definitions/dto.CompanyResponse'
      created_at:
        example: "2026-05-01T12:00:00Z"
        type: string
      description:
        example: We are looking for an experienced Go engineer.
        type: string
      id:
        example: b2c3d4e5-...
        type: string
      job_type:
        example: full_time
        type: string
      location:
        example: Colombo, Sri Lanka
        type: string
      status:
        example: open
        type: string
      title:
        example: Senior Go Engineer
        type: string
    type: object
  dto.LoginRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: secret1234
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      full_name:
        example: Alice Smith
        maxLength: 100
        minLength: 2
        type: string
      password:
        example: secret1234
        minLength: 8
        type: string
      role:
        enum:
        - candidate
        - recruiter
        example: candidate
        type: string
    required:
    - email
    - full_name
    - password
    - role
    type: object
  dto.UpdateApplicationStatusRequest:
    properties:
      status:
        enum:
        - screening
        - interview
        - offer
        - hired
        - rejected
        example: screening
        type: string
    required:
    - status
    type: object
  dto.UpdateCompanyRequest:
    properties:
      description:
        example: Updated description.
        type: string
      industry:
        example: Technology
        maxLength: 100
        type: string
      location:
        example: Colombo 03, Sri Lanka
        maxLength: 150
        type: string
      name:
        example: TechCorp Lanka
        maxLength: 150
        minLength: 2
        type: string
      website:
        example: https://techcorplanka.com
        type: string
    type: object
  dto.UpdateJobRequest:
    properties:
      description:
        example: Updated description.
        type: string
      job_type:
        enum:
        - full_time
        - part_time
        - contract
        - internship
        example: contract
        type: string
      location:
        example: Remote
        maxLength: 150
        type: string
      title:
        example: Senior Go Engineer (Updated)
        maxLength: 150
        minLength: 2
        type: string
    type: object
  dto.UserResponse:
    properties:
      company_id:
        example: ""
        type: string
      created_at:
        example: "2026-05-01T12:00:00Z"
        type: string
      email:
        example: alice@example.com
        type: string
      full_name:
        example: Alice Smith
        type: string
      id:
        example: d4f5a2b1-...
        type: string
      role:
        example: candidate
        type: string
    type: object
  handler.APIResponse:
    properties:
      data: {}
      errors: {}
      message:
        type: string
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@hireflow.com
    name: HireFlow Support
  description: A production-grade Job Recruitment REST API built with Go and Gin.
  license:
    name: MIT
  title: HireFlow API
  version: "1.0"
paths:
  /applications/{id}:
    delete:
      description: Permanently removes the candidate's application. Candidate only.
      parameters:
      - description: Application UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Withdraw an application
      tags:
      - Applications
    get:
      description: Returns a single application. Candidate sees own only; recruiter
        sees their job's only.
      parameters:
      - description: Application UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ApplicationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Get an application
      tags:
      - Applications
  /applications/{id}/status:
    patch:
      consumes:
      - application/json
      description: Advances or rejects an application in the pipeline. Recruiter only.
      parameters:
      - description: Application UUID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateApplicationStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ApplicationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Update application status
      tags:
      - Applications
  /applications/my:
    get:
      description: Returns all applications submitted by the current candidate.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ApplicationResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: My applications
      tags:
      - Applications
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password, receive a JWT token
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                errors:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: Login
      tags:
      - Auth
  /auth/me:
    get:
      description: Returns the profile of the currently authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new candidate or recruiter account
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.UserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                errors:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      summary: Register a new user
      tags:
      - Auth
  /companies:
    get:
      description: Returns a list of all companies. Public endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.CompanyResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: List all companies
      tags:
      - Companies
    post:
      consumes:
      - application/json
      description: Creates a new company. Admin only.
      parameters:
      - description: Company details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateCompanyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                errors:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Create a company
      tags:
      - Companies
  /companies/{id}:
    delete:
      description: Soft-deletes a company. Admin only.
      parameters:
      - description: Company UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a company
      tags:
      - Companies
    get:
      description: Returns a single company by ID. Public endpoint.
      parameters:
      - description: Company UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: Get a company
      tags:
      - Companies
    put:
      consumes:
      - application/json
      description: Updates company details. Recruiter only.
      parameters:
      - description: Company UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateCompanyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CompanyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Update a company
      tags:
      - Companies
  /companies/{id}/jobs:
    post:
      consumes:
      - application/json
      description: Creates a job under a company. Recruiter only.
      parameters:
      - description: Company UUID
        in: path
        name: id
        required: true
        type: string
      - description: Job details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.JobResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "422":
          description: Unprocessable Entity
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                errors:
                  additionalProperties:
                    type: string
                  type: object
              type: object
      security:
      - BearerAuth: []
      summary: Post a job
      tags:
      - Jobs
  /jobs:
    get:
      description: Returns all open job postings. Public endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.JobResponse'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: List open jobs
      tags:
      - Jobs
  /jobs/{id}:
    delete:
      description: Deletes a job posting. Only the recruiter who posted it.
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Delete a job
      tags:
      - Jobs
    get:
      description: Returns a single job posting by ID. Public endpoint.
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.JobResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      summary: Get a job
      tags:
      - Jobs
    put:
      consumes:
      - application/json
      description: Updates a job posting. Only the recruiter who posted it.
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateJobRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.JobResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Update a job
      tags:
      - Jobs
  /jobs/{id}/applications:
    get:
      description: Lists all applications for a job. Only the recruiter who posted
        it.
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.ApplicationResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.APIResponse'
      security:
      - BearerAuth: []
      summary: Applications for a job
      tags:
      - Applications
  /jobs/{id}/apply:
    post:
      consumes:
      - application/json
      description: Submit an application to an open job. Candidate only.
      parameters:
      - description: Job UUID
        in: path
        name: id
        required: true
        type: string
      - description: Cover letter
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ApplyJobRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/handler.APIResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ApplicationResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handler.APIResponse'
        "404":
          description: Not Found
          schema:
